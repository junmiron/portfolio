<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}junmiron · AI apps{% endblock %}</title>
<meta name="description" content="{% block description %}AI apps I design, build and ship.{% endblock %}">
{% block social_meta %}{% endblock %}
<style>
  :root {
    --bg: #0b0d12; --panel: #12151c; --border: #232837;
    --text: #e6e9f0; --muted: #9aa3b5; --accent: #4f8cff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 24px; }
  header.site { border-bottom: 1px solid var(--border); }
  header.site .wrap { display: flex; align-items: center; justify-content: space-between; height: 56px; }
  .brand { font-weight: 600; color: var(--text); letter-spacing: .2px; }
  nav a { color: var(--muted); margin-left: 16px; }
  main { padding: 48px 0 64px; }
  h1 { font-size: 34px; line-height: 1.2; margin: 0 0 8px; }
  .lead { color: var(--muted); font-size: 18px; margin: 0 0 32px; }
  .intro { font-size: 18.5px; line-height: 1.55; margin: 0 0 12px; }
  .context { color: var(--muted); font-size: 14.5px; margin: 0 0 28px; }
  section.block h3 { font-size: 15px; margin: 18px 0 4px; color: var(--text); }
  section.block h3:first-of-type { margin-top: 0; }
  .tldr { margin: 0; padding-left: 20px; }
  .tldr li { margin: 0 0 8px; }
  .tldr li:last-child { margin-bottom: 0; }
  .tldr strong { color: var(--text); font-weight: 600; }
  figure { margin: 14px 0; }
  figure img { width: 100%; max-width: 720px; border-radius: 8px; border: 1px solid var(--border); display: block; }
  figcaption { color: var(--muted); font-size: 13.5px; font-style: italic; margin-top: 8px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px;
           font-weight: 600; letter-spacing: .4px; text-transform: uppercase; vertical-align: middle; margin-left: 10px; }
  .badge.live { background: #12351f; color: #4ade80; border: 1px solid #1d5c34; }
  .badge.beta, .badge.preview { background: #3a2e12; color: #fbbf24; border: 1px solid #6b5416; }
  .badge.prototype { background: #1e2433; color: #9aa3b5; border: 1px solid var(--border); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .card-featured { color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 10px; }
  .featured-card { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(260px, 1fr); gap: 24px; align-items: center; }
  .card-shot { width: 100%; aspect-ratio: 2.3 / 1; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); display: block; }
  .card-title-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card-title-row .badge { margin-left: 0; flex: 0 0 auto; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .card-tags span { background: #1a2030; border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px; font-size: 12px; color: var(--muted); }
  .card-cta { display: inline-block; margin-top: 16px; font-size: 14px; font-weight: 600; }
  .hero { margin-bottom: 40px; }
  .hero h1 { font-size: clamp(34px, 5vw, 48px); margin-bottom: 12px; }
  .hero .lead { max-width: 760px; margin-bottom: 18px; }
  .hero-links a { margin-right: 14px; font-weight: 600; }
  .projects-heading { margin: 42px 0 8px; color: var(--text); font-size: 22px; text-transform: none; letter-spacing: 0; }
  .footer-links { display: inline-flex; flex-wrap: wrap; gap: 14px; margin-left: 12px; }
  .footer-links a { color: var(--muted); }
  @media (max-width: 640px) { .wrap { padding: 0 16px; } main { padding: 32px 0 48px; } .hero h1 { font-size: 34px; } .featured-card { grid-template-columns: 1fr; gap: 16px; } .card-title-row { align-items: flex-start; flex-direction: column; } }
  .card a.title { color: var(--text); display: block; margin-bottom: 6px; font-size: 18px; font-weight: 600; }
  .card p { margin: 0; color: var(--muted); font-size: 14.5px; }
  section.block { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; margin-top: 20px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 0 0 12px; }
  section.block p { margin: 0; }
  section.block p.sample-question { margin-top: 8px; margin-bottom: 10px; color: var(--muted); }
  .chips span { display: inline-block; background: #1a2030; border: 1px solid var(--border); border-radius: 999px;
                padding: 3px 12px; font-size: 13px; margin: 0 6px 6px 0; color: var(--text); }
  .links a { display: inline-block; margin-right: 18px; font-weight: 500; }
  .demo-cta { margin: 0 0 12px; font-size: 15px; }
  .demo-cta a { font-weight: 600; }
  .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 16px; }
  .shots img { width: 100%; border-radius: 8px; border: 1px solid var(--border); display: block; }
  video { width: 100%; max-width: 540px; border-radius: 8px; border: 1px solid var(--border); background: #000; }
  .metric { font-size: 20px; font-weight: 600; color: var(--text); }
  footer.site { border-top: 1px solid var(--border); color: var(--muted); font-size: 13.5px; padding: 24px 0 40px; }
  .empty { color: var(--muted); background: var(--panel); border: 1px dashed var(--border); border-radius: 12px; padding: 40px; text-align: center; }
</style>
</head>
<body>
<header class="site"><div class="wrap">
  <a class="brand" href="/">junmiron · AI apps</a>
  <nav><a href="/#about">About</a></nav>
</div></header>
<main class="wrap">{% block content %}{% endblock %}</main>
<footer class="site"><div class="wrap">Built and maintained by junmiron. <span class="footer-links"><a href="https://www.linkedin.com/in/juanmanuelmiron/">LinkedIn</a><a href="https://github.com/junmiron">GitHub</a><a href="mailto:junmiron@gmail.com">Email</a></span></div></footer>
</body>
</html>
