tldr:
  - label: "What"
    text: "An 11-agent team that interviews stakeholders and drafts a 9-section functional spec."
  - label: "You get"
    text: "PDF, HTML and Markdown spec, Mermaid process diagram, timestamped Q&A trail."
  - label: "Why it's trustworthy"
    text: "Every section traces to a logged answer. If a section is missing, a deterministic fallback fills it rather than letting the model invent one."
  - label: "Runs on"
    text: "Your machine — a local LLM (Ollama, LM Studio) or a cloud LLM with its key (OpenAI, Azure, Groq and more)."
  - label: "Stack"
    text: "Python, AutoGen, FastAPI, React, Typst."
  - label: "Status"
    text: "v1.3.0 technical preview, MIT licensed."
sections:
  - title: "How does the 11-agent pipeline work?"
    body: "Eleven agents sit in one AutoGen 0.7.5 SelectorGroupChat. The planning agent decomposes the task and hands off with [ASSIGNMENT] markers; the interviewer asks one question per turn and every Q&A pair is saved to interview.jsonl. A summarizer requires the exact phrase APPROVE SUMMARY. The writer, glossary and use-case agents draft the spec; a checker bounces missing sections back up to three rounds, then a deterministic fallback fills the gaps. A diagram creator and a Mermaid reviewer produce the process diagram. Only terminate_agent can end a run, and only after the deliverables are written."
  - title: "How is the interview budgeted?"
    body: "Runs are capped by MAX_MESSAGES (default 300) and can only be ended by terminate_agent. The interviewer asks exactly one question per turn, and while the team waits for an answer, only the user may speak. Hand-offs are driven by explicit markers, not free conversation, so a run cannot drift or loop."
  - title: "What do you get at the end of a run?"
    body: "A session folder with the 9-section FSD (scope, FRs, NFRs, roles, assumptions, use cases, glossary) in Markdown, a Typst-typeset PDF with cover page and linked contents, a self-contained HTML file with the diagram inlined as vector SVG, the Mermaid source plus rendered PNG and SVG, and a timestamped Q&A audit trail. Tall diagrams are split into page-sized bands so nothing is clipped."
  - title: "How do you run it?"
    body: "Python 3.11 or 3.13, Node with mermaid-cli for diagrams, and an LLM of your choice — local (Ollama, LM Studio) or cloud (OpenAI, Azure, Groq). Cloud providers need their API key, configurable per model lane from the in-app settings page. There is no hosted demo."
  - title: "What does the test suite cover?"
    body: "An offline pytest suite runs the whole 11-agent pipeline end to end with a scripted model client: no API key, no network. It covers selector routing, the termination guard, config hygiene, the FastAPI contract, transcript ingestion, spec continuation and Typst rendering."
limitations:
  - "The interview is interactive: a human must answer every question unless human simulation is enabled."
  - "The summarizer only accepts the exact phrase APPROVE SUMMARY."
  - "The config endpoint is unauthenticated and intended for local, single-user use."
  - "The Chainlit view is a debug surface, not a finished product; the React UI is the front-end."
next_steps: "Porting the agent layer off AutoGen (no longer being developed) to the frameworks that own the market: LangChain, Microsoft Agent Framework and LangGraph."
launched: 2026-11-07
